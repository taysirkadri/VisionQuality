services:
  api-tensorrt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.tensorrt
    environment:
      DEFECT_BACKEND: onnx-tensorrt
      DEFECT_MODEL_PATH: /app/models/best.onnx
      DEFECT_TENSORRT_FP16: "true"
      DEFECT_TENSORRT_DEVICE_ID: "0"
      DEFECT_TENSORRT_MAX_WORKSPACE_MB: "2048"
      DEFECT_TENSORRT_ENGINE_CACHE: /app/models/tensorrt
      DEFECT_TENSORRT_TIMING_CACHE: /app/models/tensorrt
      DEFECT_PROVIDER_FALLBACK: "true"
      DEFECT_WARMUP_REQUESTS: "10"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../models:/app/models
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    command: streamlit run src/industrial_defect_detection/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      DEFECT_BACKEND: fake
      API_URL: http://api-tensorrt:8000
    ports:
      - "8501:8501"
    depends_on:
      - api-tensorrt
